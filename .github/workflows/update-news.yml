# Положите этот файл в репозиторий по пути: .github/workflows/update-news.yml
name: Update news

on:
  schedule:
    # Время в UTC! Здесь: 09, 12, 15, 18, 21 по часовому поясу UTC+2 (зима).
    # Летом (UTC+3) замените на: "0 6,9,12,15,18 * * *"
    - cron: "0 7,10,13,16,19 * * *"
  workflow_dispatch: # кнопка ручного запуска во вкладке Actions

permissions:
  contents: write # сохранять data/articles.json обратно в репозиторий
  pages: write
  id-token: write

concurrency:
  group: news-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Собрать новости и обновить страницу
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_TZ: Europe/Kyiv # замените на свой часовой пояс, если нужно
          NEWS_BOT_UA: "PCDigestBot/1.0 (+https://github.com/ВАШ_ЛОГИН/ВАШ_РЕПОЗИТОРИЙ)"
        run: python pc_news_bot.py run
        # Без ИИ (бесплатно): замените строку выше на  python pc_news_bot.py run --no-ai

      - name: Сохранить список обработанных новостей
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/articles.json
          git diff --cached --quiet || git commit -m "Update news $(date -u +'%Y-%m-%d %H:%M')"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
